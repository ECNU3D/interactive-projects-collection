<script>
// 本自检页把 localStorage 换成页内内存 shim。理由：score.js / app.js / choice.js 会真实
// 读写 shanhe_save_v1 与 shanhe_settings_v1，若直落真实存储，人工在日常浏览器 profile 里
// 打开本页就会污染玩家存档（CDP 运行器每次用独立 user-data-dir 不受影响，但本页也支持
// 人工打开）。必须在任何项目脚本之前替换，否则 app.js 的 init() 已经读过真实存档了。
(function () {
  var mem = Object.create(null);
  var shim = {
    getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
    setItem: function (k, v) { mem[k] = String(v); },
    removeItem: function (k) { delete mem[k]; },
    clear: function () { mem = Object.create(null); },
    key: function (i) { return Object.keys(mem)[i] || null; }
  };
  Object.defineProperty(shim, "length", { get: function () { return Object.keys(mem).length; } });
  Object.defineProperty(window, "localStorage", { configurable: true, get: function () { return shim; } });
})();
</script>

<script type="module">
import "./js/walkin.js";

var R = { pass: 0, fail: 0, messages: [] };
function ok(cond, msg) { if (cond) R.pass++; else { R.fail++; R.messages.push("✘ " + msg); } }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function report() {
  document.getElementById("out").textContent =
    "通过 " + R.pass + " 项，失败 " + R.fail + " 项\n" + R.messages.join("\n");
}
// 任何段落抛异常都要先把已有结果写出去，否则运行器只能等到超时、拿不到任何诊断信息
window.addEventListener("error", function () { report(); });

// ============ Task 1：localStorage shim 与时钟原语 ============

ok(!(window.localStorage instanceof Storage), "localStorage 已被页内内存 shim 替换（不污染真实存档）");
window.localStorage.setItem("__probe__", "1");
ok(window.localStorage.getItem("__probe__") === "1", "shim 的 setItem/getItem 往返正常");
window.localStorage.removeItem("__probe__");

var KIT = window.SHY_AUTOPLAY_KIT;
ok(!!KIT, "window.SHY_AUTOPLAY_KIT 已挂载");
ok(typeof KIT.createClock === "function" && typeof KIT.orbitEase === "function"
   && typeof KIT.isCancelledError === "function", "kit 三个入口都是函数");

// 缓动曲线：端点精确、单调不减、总位移恰为 1（否则环绕一周会差一截或多转一点）
ok(KIT.orbitEase(0) === 0 && KIT.orbitEase(1) === 1, "orbitEase 端点精确为 0 与 1");
var monotonic = true, prevE = -1;
for (var q = 0; q <= 100; q++) { var e = KIT.orbitEase(q / 100); if (e < prevE - 1e-9) monotonic = false; prevE = e; }
ok(monotonic, "orbitEase 单调不减（镜头不会倒转）");
ok(Math.abs(KIT.orbitEase(0.5) - 0.5) < 1e-6, "orbitEase 在中点为 0.5（两端缓动对称）");

// wait 基本时长
var clk = KIT.createClock();
var t0 = Date.now();
await clk.wait(300);
var dt0 = Date.now() - t0;
ok(dt0 >= 260 && dt0 <= 450, "wait(300) 实测 " + dt0 + "ms");

// 暂停语义（设计文档 §9.1 断言 4）：wait(1000) 开始 200ms 后暂停 2000ms 再继续，
// 总墙钟应 ≈3000ms。≈4000ms 说明恢复时重开了完整时长的定时器（明确禁止的实现），
// ≈1000ms 说明暂停对该等待未生效。
var t1 = Date.now();
var p1 = clk.wait(1000);
setTimeout(function () { clk.pause(); }, 200);
setTimeout(function () { clk.resume(); }, 2200);
await p1;
var dt1 = Date.now() - t1;
ok(dt1 >= 2820 && dt1 <= 3250,
  "暂停 2s 的 wait(1000) 应 ≈3000ms，实测 " + dt1 + "ms（≈4000=恢复时重开完整定时器，≈1000=暂停未生效）");
ok(clk.isPaused() === false, "resume 后 isPaused 为 false");

// waitFor 命中与超时
var flag = false;
setTimeout(function () { flag = true; }, 300);
var hit = await clk.waitFor(function () { return flag; }, { timeoutMs: 3000 });
ok(hit === true, "waitFor 条件命中返回 true");
var miss = await clk.waitFor(function () { return false; }, { timeoutMs: 300 });
ok(miss === false, "waitFor 超时返回 false 而非抛错");
var immediate = await clk.waitFor(function () { return true; }, { timeoutMs: 3000 });
ok(immediate === true, "waitFor 对已成立的条件立即返回 true");

// withCap：永不 settle 的 promise 也不能把放映挂死
var t2 = Date.now();
var capped = await clk.withCap(new Promise(function () {}), 250);
ok(capped === undefined && Date.now() - t2 < 900, "withCap 超时后 resolve(undefined) 而非挂死");
var passthrough = await clk.withCap(Promise.resolve("值"), 5000);
ok(passthrough === "值", "withCap 在 promise 先完成时透传其值");
clk.cancel();

// cancel 令 pending 等待以 CancelledError reject
var clk2 = KIT.createClock();
var rejectedKind = null;
var pending = clk2.wait(5000).then(function () { rejectedKind = "resolved"; },
                                   function (e) { rejectedKind = KIT.isCancelledError(e) ? "cancelled" : "other"; });
clk2.cancel();
await pending;
ok(rejectedKind === "cancelled", "cancel() 令 pending 的 wait 以 CancelledError reject，实际 " + rejectedKind);
ok(clk2.isCancelled() === true, "cancel 后 isCancelled 为 true");

// ============ Task 2：全景 360° 环绕 ============

var C = window.SHY_CHOICE;
ok(typeof C.orbitPanorama === "function" && typeof C.setViewMode === "function"
   && typeof C.setAutoplayActive === "function" && typeof C.setOrbitPaused === "function"
   && typeof C.debugPano === "function", "SHY_CHOICE 四个放映契约方法 + debugPano 均已导出");

// 尚未打开任何抉择（全景层不存在/隐藏）时必须立即 resolve(false)，绝不能挂死
var t3 = Date.now();
var noPano = await C.orbitPanorama({ durationMs: 5000 });
ok(noPano === false && Date.now() - t3 < 500, "未进入环景模式时 orbitPanorama 立即 resolve(false)");

// 打开 c01（有 2:1 全景图），等环景引擎起来
document.dispatchEvent(new CustomEvent("shy:enter-choice", { detail: { choiceId: "c01" } }));
var panoEl = null;
for (var pi = 0; pi < 60 && !panoEl; pi++) {
  await sleep(100);
  var el = document.querySelector(".choice-bg-pano");
  if (el && !el.hidden) panoEl = el;
}
ok(panoEl !== null, "c01 以环景模式启动（.choice-bg-pano 可见）");
ok(C.debugPano().panoTileW > 0, "panoTileW 已算出，实际 " + C.debugPano().panoTileW);

// 环绕一周的位移必须恰为一个平铺宽度——差一截就会看见全景接缝
var st0 = C.debugPano();
var orbited = await C.orbitPanorama({ durationMs: 600 });
var st1 = C.debugPano();
var moved = st1.panoX - st0.panoX;
ok(orbited === true, "环景模式下 orbitPanorama resolve(true)");
ok(Math.abs(moved + st0.panoTileW) < 1.5,
  "环绕一周位移 ≈ -panoTileW（实测 " + moved.toFixed(2) + " vs " + (-st0.panoTileW).toFixed(2) + "）");
ok(C.debugPano().orbiting === false, "环绕结束后 orbiting 复位为 false");

// 暂停：冻结期间位移必须为 0
var pausedOrbit = C.orbitPanorama({ durationMs: 1200 });
await sleep(150);
C.setOrbitPaused(true);
var pa = C.debugPano().panoX;
await sleep(350);
var pb = C.debugPano().panoX;
C.setOrbitPaused(false);
await pausedOrbit;
ok(Math.abs(pb - pa) < 1, "setOrbitPaused(true) 期间环绕位移冻结（实测 " + (pb - pa).toFixed(2) + "px）");

// 放映态：拖拽必须失效，否则观众误触会和镜头轨道打架
C.setAutoplayActive(true);
var ov = document.querySelector(".choice-overlay");
ok(ov.classList.contains("is-autoplay"), "setAutoplayActive(true) 加上 .is-autoplay 类");
var dragBefore = C.debugPano().panoX;
ov.dispatchEvent(new PointerEvent("pointerdown", { clientX: 100, clientY: 300, pointerId: 1, bubbles: true, cancelable: true }));
ov.dispatchEvent(new PointerEvent("pointermove", { clientX: 400, clientY: 300, pointerId: 1, bubbles: true }));
var dragAfter = C.debugPano().panoX;
ov.dispatchEvent(new PointerEvent("pointerup", { clientX: 400, clientY: 300, pointerId: 1, bubbles: true }));
ok(Math.abs(dragAfter - dragBefore) < 5,
  "放映态全景拖拽被禁用（300px 拖拽未产生位移，实测 " + (dragAfter - dragBefore).toFixed(1) + "px）");

// 放映态 + 观景模式下，「AI 生成想象图」角标必须仍然可见（项目硬规则）
C.setViewMode(true);
await sleep(50);
var badge = document.querySelector(".choice-ai-badge");
ok(parseFloat(getComputedStyle(badge).opacity) > 0.5,
  "放映态的观景模式下 AI 角标仍可见（opacity=" + getComputedStyle(badge).opacity + "）");
C.setViewMode(false);
C.setAutoplayActive(false);
await sleep(50);
ok(parseFloat(getComputedStyle(document.querySelector(".choice-ai-badge")).opacity) > 0.5,
  "退出放映态后角标恢复常态可见");

// ============ Task 3：高斯泼溅原地环视 ============

var W = window.SHY_WALKIN;
ok(typeof W.orbit === "function" && typeof W.setOrbitPaused === "function",
   "SHY_WALKIN.orbit / setOrbitPaused 已导出");

// 无模型的抉择：立即 resolve(false)，且不得创建覆盖层（c99 是约定的"永不放置模型"的 id）
var noModel = await W.orbit("c99", { durationMs: 500 });
ok(noModel === false, "无模型的 c99：orbit resolve(false)，实际 " + noModel);
ok(document.querySelector(".walkin-overlay") === null, "无模型时不创建覆盖层");

// c01 有模型：真实加载并环视。.spz 约 49MB，本机 HTTP 下加载数秒，给足超时。
var yaws = [];
var uiChecked = false, exitHiddenInOrbit = false, hintTextInOrbit = "";
var orbitPromise = W.orbit("c01", { durationMs: 4000 });
for (var wi = 0; wi < 400; wi++) {
  await sleep(50);
  var st = W.debugState();
  if (!st) { if (yaws.length) break; else continue; }
  if (!uiChecked && st.overlay) {
    uiChecked = true;
    exitHiddenInOrbit = st.overlay.querySelector(".walkin-exit").hidden === true;
    hintTextInOrbit = st.overlay.querySelector(".walkin-hint").textContent;
  }
  if (st.camera && st.mesh && st.mesh.isInitialized) yaws.push(st.camera.rotation.y);
}
var orbitOk = await orbitPromise;

ok(orbitOk === true, "c01 环视 resolve(true)，实际 " + orbitOk);
ok(W.isOpen() === false, "环视结束后自动关闭（isOpen 为 false）");
ok(document.querySelector(".walkin-overlay") === null, "环视结束后覆盖层已从 DOM 移除");
ok(exitHiddenInOrbit === true, "环视模式下「回到抉择」按钮不渲染");
ok(hintTextInOrbit.indexOf("自动环视") >= 0, "环视模式下提示文案改为「自动环视中」，实际「" + hintTextInOrbit + "」");
ok(yaws.length > 3, "环视过程中采到多帧 camera.rotation.y（实际 " + yaws.length + " 帧）");
var monotoneYaw = yaws.every(function (y, i) { return i === 0 || y <= yaws[i - 1] + 1e-6; });
ok(monotoneYaw, "yaw 单调递减（镜头只朝一个方向转，不来回摆）");
ok(yaws.length > 3 && yaws[yaws.length - 1] < -Math.PI,
   "环视转过半圈以上（末次采样 yaw=" + (yaws[yaws.length - 1] || 0).toFixed(3) + "，应 < -3.14）");

// 常规漫游模式不受影响：仍有「回到抉择」按钮与 WASD 提示
W.open("c01");
await sleep(300);
var normalOverlay = document.querySelector(".walkin-overlay");
ok(normalOverlay && normalOverlay.querySelector(".walkin-exit").hidden === false,
   "常规漫游模式仍渲染「回到抉择」按钮");
ok(normalOverlay && normalOverlay.querySelector(".walkin-hint").textContent.indexOf("WASD") >= 0,
   "常规漫游模式仍显示 WASD 提示");
W.close();
ok(document.querySelector(".walkin-overlay") === null, "常规漫游 close 后覆盖层已移除");

// ============ Task 4：沙盒进出 ============

ok(typeof window.SHY_APP.showToast === "function", "SHY_APP.showToast 已导出");
var A = window.SHY_AUTOPLAY;
ok(!!A && typeof A.start === "function" && typeof A.stop === "function"
   && typeof A.togglePause === "function" && typeof A.isRunning === "function"
   && typeof A.isPaused === "function" && typeof A.debugState === "function",
   "SHY_AUTOPLAY 六个入口均已导出");

// 造一个"玩家已有进度"的真实存档，证明放映全程不碰它
window.SHY_APP.state = {
  unlockedCount: 5, total: 777, combo: 2,
  answered: { c01: { firstTryCorrect: true, earned: 100, tries: 1, confirmed: true } },
  readExtra: { e0101: true }, litPersons: ["p_linzexu"],
  chapterEarned: { ch01: "甲" }, lastGradedChapter: "ch01", finished: false
};
window.SHY_SCORE.saveState(window.SHY_APP.state);
var rawBefore = window.localStorage.getItem("shanhe_save_v1");
var stateBefore = JSON.stringify(window.SHY_APP.state);
var saveFnBefore = window.SHY_SCORE.saveState;

var started = A.start({ debugFast: true });
ok(started === true, "start() 返回 true");
ok(A.isRunning() === true, "start 后 isRunning 为 true");
ok(window.SHY_APP.state.unlockedCount === 1 && window.SHY_APP.state.total === 0,
   "沙盒 state 被替换为全新状态（unlockedCount=" + window.SHY_APP.state.unlockedCount +
   " total=" + window.SHY_APP.state.total + "）");
ok(window.SHY_SCORE.saveState !== saveFnBefore, "saveState 已被劫持为 no-op");

// 重复 start 必须无效，否则会用沙盒 state 覆盖掉快照，真实存档一去不返
var restarted = A.start({ debugFast: true });
ok(restarted === false, "放映进行中重复 start() 返回 false 且不重置快照");

// 放映期任何写盘调用都必须落空
window.SHY_APP.state.total = 9999;
window.SHY_SCORE.saveState(window.SHY_APP.state);
ok(window.localStorage.getItem("shanhe_save_v1") === rawBefore, "放映期 saveState 调用不写盘");

A.stop();
ok(A.isRunning() === false, "stop 后 isRunning 为 false");
ok(window.SHY_SCORE.saveState === saveFnBefore, "stop 后 saveState 已还原为原函数");
ok(JSON.stringify(window.SHY_APP.state) === stateBefore, "stop 后 state 与启动前快照深度相等");
ok(window.localStorage.getItem("shanhe_save_v1") === rawBefore, "stop 后 localStorage 逐字节未变");

// 重复 stop 必须幂等：若不加守卫，第二次 stop 会把已经是 no-op 的 saveState 当作"原函数"存下来，
// 从此真实存档永远写不进去——这类静默损坏最难排查，必须有断言钉住。
A.stop();
ok(window.SHY_SCORE.saveState === saveFnBefore, "重复 stop() 幂等，不会把 no-op 误当原函数保存");
ok(JSON.stringify(window.SHY_APP.state) === stateBefore, "重复 stop() 不破坏已还原的 state");

// 异常安全网 1：start() 关键段（快照/劫持/换态/首帧渲染）中途抛出必须完整回滚，
// 不能把 saveState 停在 no-op、把 state 停在沙盒态、把 clock 定时器晾在那不 cancel。
var renderOrig = window.SHY_SCROLL.render;
window.SHY_SCROLL.render = function () { throw new Error("模拟渲染异常"); };
var startThrew = A.start({ debugFast: true });
window.SHY_SCROLL.render = renderOrig;
ok(startThrew === false, "start() 关键段抛出时返回 false，实际 " + startThrew);
ok(A.isRunning() === false, "start() 回滚后 isRunning 为 false");
ok(window.SHY_SCORE.saveState === saveFnBefore, "start() 回滚后 saveState 仍是原函数");
ok(JSON.stringify(window.SHY_APP.state) === stateBefore, "start() 回滚后 state 与启动前快照深度相等");

// 回滚必须彻底：紧接着的正常 start()/stop() 应照常工作，证明没有半开状态卡住
// （比如 clock 没 cancel、running 卡在 true 导致后续 start() 一律被挡）
var startAgainOk = A.start({ debugFast: true });
A.stop();
ok(startAgainOk === true && A.isRunning() === false
   && window.SHY_SCORE.saveState === saveFnBefore
   && JSON.stringify(window.SHY_APP.state) === stateBefore,
   "start() 异常回滚后仍可正常重新放映一轮并干净收尾");

// 异常安全网 2：stop() 收尾阶段（teardownScene，如 WebGL 上下文丢失导致 renderer.dispose 抛）
// 中途抛出，也必须无条件走到 saveState/state 的还原——这与"重复 stop 不加守卫"是同一类
// 静默永久损坏，只是这次由异常路径触发，且此前没有任何回归信号覆盖它。
var startedForStopThrow = A.start({ debugFast: true });
ok(startedForStopThrow === true, "为 stop() 异常用例准备一次正常放映");
var walkinCloseOrig = window.SHY_WALKIN.close;
window.SHY_WALKIN.close = function () { throw new Error("模拟 WebGL 上下文丢失"); };
A.stop();
window.SHY_WALKIN.close = walkinCloseOrig;
ok(A.isRunning() === false, "stop() 收尾抛出后 isRunning 仍变为 false");
ok(window.SHY_SCORE.saveState === saveFnBefore, "stop() 收尾抛出后 saveState 仍被还原为原函数");
ok(JSON.stringify(window.SHY_APP.state) === stateBefore, "stop() 收尾抛出后 state 仍被还原为启动前快照");
ok(window.localStorage.getItem("shanhe_save_v1") === rawBefore, "stop() 收尾抛出后 localStorage 逐字节未变");

// ============ Task 5：全程时间轴 ============

window.SHY_APP.state = window.SHY_SCORE.newState();
window.SHY_SCORE.saveState(window.SHY_APP.state);
var raw5 = window.localStorage.getItem("shanhe_save_v1");
var snap5 = JSON.stringify(window.SHY_APP.state);

A.start({ debugFast: true });
var ended5 = false;
for (var k5 = 0; k5 < 3000; k5++) {          // 最长 300s
  await sleep(100);
  if (!A.isRunning()) { ended5 = true; break; }
}
ok(ended5 === true, "debugFast 全程放映在 300s 内自行跑完并停止");

var lr = A.debugState().lastRun;
ok(!!lr, "stop 前记录了沙盒终态 lastRun");
ok(lr && lr.finished === true, "放映走到通关（沙盒 state.finished 为 true）");
ok(lr && lr.view === "ending", "终态停在 ending 视图，实际 " + (lr && lr.view));

await sleep(150);
ok(closeCalls > 0, "停止放映时关闭影片覆盖层，实际调用 " + closeCalls + " 次");

window.SHY_CHAPTER_FILM.play = realFilmPlay;
window.SHY_CHAPTER_FILM.close = realFilmClose;
window.SHY_CHAPTER_FILM.setPaused = realFilmSetPaused;

// ============ Task 1：续播的沙盒起点 ============

// 造一个"玩家已推进到第 46 幕、且有得分"的真实存档
function makeResumeState() {
  return {
    unlockedCount: 46, total: 1234, combo: 3,
    answered: { c01: { firstTryCorrect: true, earned: 100, tries: 1, confirmed: true } },
    readExtra: { e0101: true }, litPersons: ["p_linzexu"],
    chapterEarned: { ch01: "甲", ch02: "乙" }, lastGradedChapter: "ch02", finished: false
  };
}

window.SHY_APP.state = makeResumeState();
window.SHY_SCORE.saveState(window.SHY_APP.state);
var rawBeforeResume = window.localStorage.getItem("shanhe_save_v1");
var stateBeforeResume = JSON.stringify(window.SHY_APP.state);

// resume:true —— 沙盒态应当继承玩家进度，而不是从零开始
A.start({ debugFast: true, resume: true });
ok(A.isRunning() === true, "resume 模式可以启动");
ok(window.SHY_APP.state.unlockedCount === 46,
   "续播沙盒态继承玩家的 unlockedCount，实际 " + window.SHY_APP.state.unlockedCount);
ok(window.SHY_APP.state.total === 1234,
   "续播沙盒态继承玩家的 total，实际 " + window.SHY_APP.state.total);

// 本次唯一的新失败模式：沙盒态与"用于还原的快照"必须是两份互相独立的深拷贝。
// 若实现写成 app().state = snapshot，下面这行改动会直接改到打算还原回去的那个对象，
// 退场时"还原"的将是被放映改过的状态——玩家进度被悄悄改写。
window.SHY_APP.state.total = 999999;
window.SHY_APP.state.unlockedCount = 99;
// 嵌套字段：浅拷贝（Object.assign({}, snapshot)）也能通过上面两条原始字段改动，
// 只有嵌套对象才会在浅拷贝下与 snapshot 共享引用而"泄漏"。夹具里 chapterEarned.ch01
// 原值是 "甲"，若沙盒态与快照共享了这个对象，下面的还原断言会读到被污染的 "丁"。
window.SHY_APP.state.chapterEarned.ch01 = "丁";
A.stop();
ok(JSON.stringify(window.SHY_APP.state) === stateBeforeResume,
   "改动续播沙盒态（含嵌套字段）不影响退场还原（两份拷贝相互独立）");
ok(window.SHY_APP.state.total === 1234,
   "退场后 total 仍是启动前的 1234，实际 " + window.SHY_APP.state.total);
ok(window.localStorage.getItem("shanhe_save_v1") === rawBeforeResume,
   "续播全程 localStorage 逐字节未变");

// resume:false（默认）仍是全新状态，不受本次改动影响
window.SHY_APP.state = makeResumeState();
A.start({ debugFast: true });
ok(window.SHY_APP.state.unlockedCount === 1 && window.SHY_APP.state.total === 0,
   "resume 省略时仍为全新沙盒态（unlockedCount=" + window.SHY_APP.state.unlockedCount +
   " total=" + window.SHY_APP.state.total + "）");
A.stop();
ok(window.SHY_APP.state.total === 1234, "从头模式退场后同样原样还原");

// ============ I-1：续播落在"已作答未确认"的抉择上不应死等 20 秒 ============

// 可达场景：玩家在前沿那一幕答完题、读完「历史真实走向」，没点「继续前行」就离开——
// choice.js 重开该幕时走的是 renderAnsweredReplay 回顾视图（js/choice.js:350/405），
// 它根本不渲染选项。让前沿恰好落在这样的幕上：全数据里唯一的收尾幕 e1506（choiceId
// c26，也是全部 93 幕里最后一个），构造 unlockedCount=93 使其成为前沿。这样一次续播
// 只会播这一幕，耗时几乎全部来自 pickCorrectOption 是否按预期短路——没有短路时会卡满
// WAIT_OPTIONS_MS（20000ms，且不受 debugFast 压缩）才放弃，去掉本文件里的短路会让下面
// 的计时断言必然失败（耗时 >= 20000ms，远超 10000ms 的判定线）。
function makeFrontierAnsweredState() {
  var s = window.SHY_SCORE.newState();
  s.unlockedCount = 93; // 前沿 = 92 = e1506（见 data/events.js，唯一含抉择的收尾幕）
  s.answered = { c26: { firstTryCorrect: true, earned: 100, tries: 1, confirmed: false } };
  return s;
}

window.SHY_APP.state = makeFrontierAnsweredState();
var frontierChoiceStart = Date.now();
A.start({ debugFast: true, resume: true });
var frontierChoiceEnded = false;
for (var fi = 0; fi < 250; fi++) {
  await sleep(100);
  if (!A.isRunning()) { frontierChoiceEnded = true; break; }
}
var frontierChoiceElapsedMs = Date.now() - frontierChoiceStart;
ok(frontierChoiceEnded === true, "续播落在已作答未确认的抉择上仍能放完（25s 内结束）");
ok(frontierChoiceElapsedMs < 10000,
   "续播落在已作答未确认的抉择上不应白等 WAIT_OPTIONS_MS（20s），实际耗时 " + frontierChoiceElapsedMs + "ms");

// ============ Task 2：续播的时间轴起点 ============

// 打桩记录实际播了哪些幕与哪些章引言。真跑不适合放进自检，要验的是跳过范围是否精确。
var playedEvents = [];
var playedIntros = [];
var realOpenEvent = window.SHY_SCROLL.openEvent;
var realFilmPlay = window.SHY_CHAPTER_FILM.play;
var realVoicePlayFor = window.SHY_VOICE.playFor;
window.SHY_SCROLL.openEvent = function (id) { playedEvents.push(id); return realOpenEvent.call(window.SHY_SCROLL, id); };
// 章引言幕会播影片或退回音频，两条路都记：影片打桩返回 false 迫使走音频路径，
// 音频路径的 playFor(ch.id) 即"这一章播了引言"的判据。
window.SHY_CHAPTER_FILM.play = function () { return Promise.resolve(false); };
window.SHY_VOICE.playFor = function (id) {
  if (/^ch\d\d$/.test(id)) playedIntros.push(id);
  return realVoicePlayFor.call(window.SHY_VOICE, id);
};

var allEvents = window.SHY_DATA.events;
var resumeFrontier = 45;              // 前沿下标 45 → unlockedCount 46 → 第 46 幕
window.SHY_APP.state = makeResumeState();   // unlockedCount = 46，见 Task 1
A.start({ debugFast: true, resume: true });
var resumeEnded = false;
for (var ri = 0; ri < 3000; ri++) {
  await sleep(100);
  if (!A.isRunning()) { resumeEnded = true; break; }
}
window.SHY_SCROLL.openEvent = realOpenEvent;
window.SHY_CHAPTER_FILM.play = realFilmPlay;
window.SHY_VOICE.playFor = realVoicePlayFor;

ok(resumeEnded === true, "续播在 300s 内跑完");
ok(playedEvents[0] === allEvents[resumeFrontier].id,
   "首个播出的幕是前沿那一幕（期望 " + allEvents[resumeFrontier].id + "，实际 " + playedEvents[0] + "）");
ok(playedEvents.length === allEvents.length - resumeFrontier,
   "播出的幕数 = 93 − 45 = 48，实际 " + playedEvents.length);

var playedBefore = playedEvents.filter(function (id) {
  return allEvents.findIndex(function (e) { return e.id === id; }) < resumeFrontier;
});
ok(playedBefore.length === 0,
   "起点之前的幕一次都没播，实际漏播 " + playedBefore.length + " 幕：" + playedBefore.join(","));

// 起点所在章不播引言；其后各章照常播
var frontierChapterId = allEvents[resumeFrontier].chapterId;
ok(playedIntros.indexOf(frontierChapterId) === -1,
   "起点所在章（" + frontierChapterId + "）未播章引言");
var chaptersAfter = window.SHY_DATA.chapters.slice().sort(function (a, b) { return a.order - b.order; })
  .filter(function (c) {
    var first = allEvents.findIndex(function (e) { return e.chapterId === c.id; });
    return first >= resumeFrontier;
  });
ok(playedIntros.length === chaptersAfter.length,
   "其后各章章引言全播（期望 " + chaptersAfter.length + "，实际 " + playedIntros.length + "）");

// I-3：续播跑完全程（doUnlock 在末幕置 finished=true 后退场）也要覆盖存档还原——
// 从头放映那一侧已有对应断言（Task 1 沙盒进出段），续播这一侧此前只有"起播后立即
// 停止"这一条覆盖，没有任何断言验证过跑到通关退场这条完整链路。
// window.SHY_APP.state 此刻仍是本轮续播自然结束（finishNaturally→stop）后还原出的
// 真实状态——下面三条零额外运行时间，这一轮本来就跑完了。rawBeforeResume 定义于
// Task 1 断言段（改动续播沙盒态的对照组），核实过本文件从那之后再没有调用过未劫持的
// 真实 SHY_SCORE.saveState（唯一的调用在其定义处之前），localStorage 内容因此没变过。
ok(A.debugState().lastRun.finished === true, "续播跑到通关（沙盒 finished 为 true）");
ok(JSON.stringify(window.SHY_APP.state) === JSON.stringify(makeResumeState()),
   "续播跑完全程后真实 state 原样还原");
ok(window.localStorage.getItem("shanhe_save_v1") === rawBeforeResume,
   "续播跑完全程后 localStorage 逐字节未变");

// resume:false 不受影响：15 章引言全播、93 幕全播
playedEvents.length = 0; playedIntros.length = 0;
window.SHY_SCROLL.openEvent = function (id) { playedEvents.push(id); return realOpenEvent.call(window.SHY_SCROLL, id); };
window.SHY_CHAPTER_FILM.play = function () { return Promise.resolve(false); };
window.SHY_VOICE.playFor = function (id) {
  if (/^ch\d\d$/.test(id)) playedIntros.push(id);
  return realVoicePlayFor.call(window.SHY_VOICE, id);
};
// 上一块的轮询若耗尽（300s 未结束）会不调 stop() 就往下走，而 start() 顶部有
// `if (running) return false` 重入保护——那样这次 start() 会静默短路，对照组测到的
// 其实是残留的第一轮，而不是新一轮从头放映。无条件收一次尾（stop 幂等）消除这个依赖。
A.stop();
await sleep(100);
window.SHY_APP.state = window.SHY_SCORE.newState();
A.start({ debugFast: true });
var fullEnded = false;
for (var rj = 0; rj < 3000; rj++) {
  await sleep(100);
  if (!A.isRunning()) { fullEnded = true; break; }
}
window.SHY_SCROLL.openEvent = realOpenEvent;
window.SHY_CHAPTER_FILM.play = realFilmPlay;
window.SHY_VOICE.playFor = realVoicePlayFor;

ok(fullEnded === true, "从头放映仍能跑完全程");
ok(playedEvents.length === 93, "从头模式播满 93 幕，实际 " + playedEvents.length);
ok(playedIntros.length === 15, "从头模式播满 15 章引言，实际 " + playedIntros.length);
ok(A.debugState().lastRun.total === 3290,
   "从头模式仍是满分 3290，实际 " + A.debugState().lastRun.total);

// ============ Task 3：入口弹窗 ============

var apBtn2 = document.getElementById("btn-autoplay");
ok(typeof A.promptAndStart === "function", "SHY_AUTOPLAY.promptAndStart 已导出");

// 有可续起点：点按钮应弹窗，且不立即开播
window.SHY_APP.state = makeResumeState();
apBtn2.click();
await sleep(150);
var prompt1 = document.querySelector(".autoplay-prompt-backdrop");
ok(prompt1 !== null, "有可续起点时点顶栏按钮弹出选择框");
ok(A.isRunning() === false, "弹窗出现时尚未开播");
ok(prompt1.querySelector(".autoplay-prompt-resume") !== null
   && prompt1.querySelector(".autoplay-prompt-fresh") !== null
   && prompt1.querySelector(".autoplay-prompt-cancel") !== null,
   "三个按钮齐备");
ok(prompt1.contains(document.activeElement), "打开即把焦点圈进弹窗");

// 取消：不开播，弹窗关闭
prompt1.querySelector(".autoplay-prompt-cancel").click();
await sleep(150);
ok(document.querySelector(".autoplay-prompt-backdrop") === null, "点取消关闭弹窗");
ok(A.isRunning() === false, "点取消不开播");

// Esc 等同取消
apBtn2.click();
await sleep(150);
ok(document.querySelector(".autoplay-prompt-backdrop") !== null, "再次弹窗");
document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
await sleep(150);
ok(document.querySelector(".autoplay-prompt-backdrop") === null, "Esc 关闭弹窗");
ok(A.isRunning() === false, "Esc 不开播");

// 从当前进度：以 resume:true 起播
var promptResumeCalls = [];
var realStart = A.start;
window.SHY_AUTOPLAY.start = function (opts) { promptResumeCalls.push(!!(opts && opts.resume)); return false; };
apBtn2.click();
await sleep(150);
document.querySelector(".autoplay-prompt-resume").click();
await sleep(150);
ok(promptResumeCalls.length === 1 && promptResumeCalls[0] === true,
   "点「从当前进度」以 resume:true 调 start，实际 " + JSON.stringify(promptResumeCalls));
ok(document.querySelector(".autoplay-prompt-backdrop") === null, "选择后弹窗关闭");

// 从头放映：以 resume:false 起播
promptResumeCalls.length = 0;
apBtn2.click();
await sleep(150);
document.querySelector(".autoplay-prompt-fresh").click();
await sleep(150);
ok(promptResumeCalls.length === 1 && promptResumeCalls[0] === false,
   "点「从头放映」以 resume:false 调 start，实际 " + JSON.stringify(promptResumeCalls));

// 无可续起点（全新存档）：不弹窗，直接从头开播
promptResumeCalls.length = 0;
window.SHY_APP.state = window.SHY_SCORE.newState();
apBtn2.click();
await sleep(150);
ok(document.querySelector(".autoplay-prompt-backdrop") === null, "全新存档不弹窗");
ok(promptResumeCalls.length === 1 && promptResumeCalls[0] === false,
   "全新存档直接以 resume:false 开播，实际 " + JSON.stringify(promptResumeCalls));

// 已通关：同样不弹窗
promptResumeCalls.length = 0;
var finishedState = window.SHY_SCORE.newState();
finishedState.unlockedCount = window.SHY_DATA.events.length + 1;
finishedState.finished = true;
window.SHY_APP.state = finishedState;
apBtn2.click();
await sleep(150);
ok(document.querySelector(".autoplay-prompt-backdrop") === null, "已通关不弹窗");
ok(promptResumeCalls.length === 1 && promptResumeCalls[0] === false,
   "已通关直接以 resume:false 开播，实际 " + JSON.stringify(promptResumeCalls));

window.SHY_AUTOPLAY.start = realStart;

report();
</script>
</body></html>
