id: qiyi_hong
name: 红衣仙女
model: speech-2.8-hd
voice_setting:
  voice_id: "Chinese (Mandarin)_Crisp_Girl"
  speed: 1.0
  pitch: 0
  emotion: calm

greet:
  - id: greet_01
    text: "见过大圣。"
  - id: greet_02
    text: "大圣安好。奴等奉旨摘桃，不敢多扰。"

topics:
  - id: zhaitao
    label: "奉旨摘桃"
    source: "第5回"
    lines:
      - id: w_hong_zhaitao_01
        speaker: pc
        text: "你们是哪一处来的？快报个名来。"
        voice_setting: { emotion: calm, speed: 1.05 }
      - id: zhaitao_02
        text: "大圣息怒。我等不是妖怪，乃王母娘娘差来的七衣仙女，摘取仙桃，大开宝阁，做蟠桃胜会。"
        quote: true
      - id: w_hong_zhaitao_03
        speaker: pc
        text: "摘多少？"
        voice_setting: { emotion: calm, speed: 1.05 }
      - id: zhaitao_04
        text: "前树二篮，中树三篮，都有定数，一篮不敢短。"
  - id: shenghui
    label: "蟠桃胜会请谁"
    source: "第5回"
    lines:
      - id: w_hong_shenghui_01
        speaker: pc
        text: "蟠桃会上，都请些甚么人？"
        voice_setting: { emotion: calm, speed: 1.05 }
      - id: shenghui_02
        text: "请的是五方五老、三清四帝，各宫各殿大小尊神，俱在请中。"
      - id: w_hong_shenghui_03
        speaker: pc
        text: "我乃齐天大圣，就请我老孙做个席尊，有何不可？"
        quote: true
        voice_setting: { emotion: happy, speed: 1.2 }
      - id: shenghui_04
        text: "请柬名录，奴等不曾得见，不敢乱回。奴等只管摘桃办差，大圣海涵。"
    next:
      - { label: "摘你们的罢。", goto: __end }

fallback:
  - id: fb_01
    text: "奴等不敢多言。"
  - id: fb_02
    text: "这个奴等不晓得，大圣问瑶池上的人去。"
bye:
  - id: bye_01
    text: "奴等告退。"
