<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>模型赏析 · 赤壁水军营寨 3D 复原</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #14181c; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #title {
    position: fixed; top: 22px; left: 26px; color: #e8dcc4; z-index: 10;
    pointer-events: none;
  }
  #title h1 { font-size: 22px; font-weight: 600; letter-spacing: 4px; }
  #title p { font-size: 12px; color: #9a8f78; margin-top: 5px; letter-spacing: 1px; }
  #title a { color: #8a7a58; pointer-events: auto; text-decoration: none; }
  #title a:hover { color: #cbbd9c; }

  #dock {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: 9px 16px; border: 1px solid #4a4234; border-radius: 3px;
    background: rgba(24, 22, 18, 0.82); color: #cbbd9c; font-size: 13px;
    letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(6px);
    transition: all 0.2s;
  }
  .btn:hover { border-color: #a8894f; color: #efe2c0; }
  .btn.active { background: #7a3b28; border-color: #a85a40; color: #f5e9d2; }

  #info {
    position: fixed; right: 24px; top: 22px; width: 270px; z-index: 10;
    background: rgba(20, 18, 15, 0.85); border: 1px solid #3d372c;
    border-radius: 4px; padding: 16px 18px; color: #cfc3a5;
    backdrop-filter: blur(8px);
  }
  #info h2 { font-size: 15px; color: #ecdfbe; letter-spacing: 2px; margin-bottom: 8px; }
  #info p { font-size: 12px; line-height: 1.75; color: #a2967d; }
  #info .ref { margin-top: 10px; font-size: 11px; color: #6e6653; }

  #hint {
    position: fixed; left: 26px; bottom: 24px; z-index: 10;
    font-size: 11px; color: #6a6350; letter-spacing: 1px;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center;
    background: #14181c; color: #cbbd9c; letter-spacing: 6px; font-size: 14px;
    transition: opacity 0.5s;
  }
  @media (max-width: 720px) { #info { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">赤 壁 · 营 寨 营 造 中 …</div>

<div id="title">
  <h1>赤壁 · 建安十三年</h1>
  <p>东汉水军营寨 程序化复原 · <a href="./index.html">← 返回赤壁大战</a></p>
</div>

<div id="info">
  <h2 id="infoName">—</h2>
  <p id="infoDesc">—</p>
  <div class="ref" id="infoRef"></div>
</div>

<div id="dock"></div>
<div id="hint">左键旋转 · 右键平移 · 滚轮缩放</div>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('loading');
  if (el) el.textContent = '资源加载失败，请刷新重试（' + (e.message || 'network') + '）';
}, true);
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/viewer.js"></script>
</body>
</html>
